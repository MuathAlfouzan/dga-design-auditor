<!doctype html>
<html lang="ar">
<head><meta charset="utf-8"><title>every check, violated</title>
<style>
  /* The mirror of pass.html: every value here is deliberately OFF the ledger, and
     every WCAG rule deliberately broken. Any check that cannot score 0 here is
     broken in the other direction — it passes things it should catch, which is
     the harder failure to notice.

     Each violation is annotated with the check it is aimed at, so a future reader
     can tell intent from accident. */

  :root { color-scheme: light; }
  body {
    margin: 0;
    background: #ffffff;
    color: #303030;                    /* C1: not a DGA token, ~7 dE from text-default */
    font-family: Georgia, serif;       /* T1: not the DGA family, and no @font-face alias */
    font-size: 15px;                   /* T2: not a ramp size */
    line-height: 21px;                 /* T4: not a ramp leading, and not paired to 15 */
    letter-spacing: 0.4px;             /* T4: ramp tracking is 0 */
    font-weight: 350;                  /* T3: not in 400/500/600/700 */
  }

  /* C1 / C2: colours far from every DGA token, used repeatedly */
  .brand-wrong  { background: #7b2ff7; color: #ffe600; }   /* violet on yellow, off-palette */
  .accent-wrong { color: #ff5c00; }

  /* S1 / S3: nothing on the spacing scale, and section rhythm off it too */
  .page    { max-width: 977px; margin-inline: auto; padding-inline: 13px; } /* S2: not 1280/32 */
  .section { margin-block-end: 37px; padding-block: 19px; }                 /* S3: not a rhythm step */
  .stack   { display: flex; flex-direction: column; gap: 7px; }             /* S1: 7 is off-scale */
  .row     { display: flex; gap: 11px; align-items: center; }               /* S1: 11 is off-scale */

  /* E1 / E2 / E3: radius, border width and shadow all off the ledger */
  .card {
    background: #ffffff;
    border: 3px solid #cfcfcf;         /* E2: width 3 is off-scale, colour off-token */
    border-radius: 11px;               /* E1: 11 is not on the radius scale */
    padding: 19px;
    box-shadow: 0 5px 9px 1px rgba(120, 0, 0, 0.33);  /* E3: matches no elevation level */
  }

  /* A1: text contrast below AA. #9a9a9a on white is 2.85:1 */
  .low-contrast { color: #9a9a9a; background: #ffffff; font-size: 15px; }

  /* A2: a CONTROL boundary at 1.2:1 — this one is in scope for 1.4.11 */
  .faint-field {
    border: 1px solid #eeeeee;
    padding: 5px; background: #ffffff; color: #303030;
    font-family: Georgia, serif; font-size: 15px;
  }

  /* A3: focus removed and not replaced */
  .no-focus { outline: none; }
  .no-focus:focus { outline: none; }
  .no-focus:focus-visible { outline: none; }

  /* A4: undersized AND crowded, so the spacing exception cannot rescue them */
  .tiny { display: inline-block; width: 14px; height: 14px; margin: 0; background: #7b2ff7; }

  /* R2: physical directional properties throughout */
  .physical-1 { margin-left: 7px; padding-right: 13px; }
  .physical-2 { margin-right: 7px; padding-left: 13px; border-left: 3px solid #cfcfcf; }
  .physical-3 { float: left; clear: left; }
  .physical-4 { left: 0; margin-left: 11px; }
  .physical-5 { border-right-width: 3px; padding-left: 19px; }

  /* M2: no prefers-reduced-motion block anywhere in this stylesheet */
  .animated { transition: opacity 333ms cubic-bezier(0.17, 0.84, 0.44, 1); }
</style>
</head>
<body>
  <div class="page">
    <section class="section stack brand-wrong">
      <!-- R1: Arabic content with NO dir=rtl on the document.
           R3: Arabic set in a Latin serif, and both numeral systems mixed. -->
      <h1 style="font-size:41px;line-height:47px">هيئة الحكومة الرقمية</h1>
      <p class="physical-1">نص عربي بخط لاتيني، بدون اتجاه صحيح. الأرقام ١٢٣ مع 456.</p>
      <p class="physical-2 accent-wrong">Mixed numerals ٠١٢ alongside 012 in one interface.</p>
      <p class="physical-3">Physical float, cleared physically.</p>
      <p class="physical-4">Physical inset and margin.</p>
      <p class="physical-5">Physical border and padding.</p>
    </section>

    <section class="section stack">
      <div class="card stack">
        <p class="low-contrast">This text sits at 2.85:1 and fails AA.</p>
        <input class="faint-field no-focus" type="text" aria-label="faint bordered field">
        <button type="button" class="no-focus animated"
                style="background:#7b2ff7;color:#ffe600;border:3px solid #cfcfcf;border-radius:11px;padding:5px 11px;font-family:Georgia,serif;font-size:15px">
          زر بقيم خارج النظام
        </button>
      </div>

      <!-- three 14px targets touching each other: undersized and crowded -->
      <div><a href="#" class="tiny" aria-label="t1"></a><a href="#" class="tiny" aria-label="t2"></a><a href="#" class="tiny" aria-label="t3"></a></div>
    </section>
  </div>
</body>
</html>
